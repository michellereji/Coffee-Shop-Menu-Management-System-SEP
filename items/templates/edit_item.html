<DOCTYPE!.html>
<html>
    <head>
        <title>Edit Item</title>
    </head>
    <body>
        <h1>Edit Item</h1>
        <form method="post">
            {% csrf_token %}
            <label for="item_name">Item Name:</label>
            <input type="text" id="item_name" name="item_name" value="{{ item.item_name }}" required>
            <br><br>
            <label for="category">Category:</label>
            <input type="text" id="category" name="category" value="{{ item.category }}">
            <br><br>
            <label for="size">Size:</label>
            <input type="text" id="size" name="size" value="{{ item.size }}">
            <br><br>
            <label for="item_price">Item Price:</label>
            <input type="number" id="item_price" name="item_price" value="{{ item.price }}" required>
            <br><br>
            <input type="submit" value="Update Item">
        </form>
    </body>
</html>
